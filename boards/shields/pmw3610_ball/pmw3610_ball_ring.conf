# PMW3610 over 3-wire SPI, reported as a USB/BLE mouse
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_POINTING=y
CONFIG_PMW3610=y

# TMAG5273 scroll ring on I2C (the driver lives in this repo: drivers/input/tmag5273_ring.c)
CONFIG_I2C=y
CONFIG_TMAG5273_RING=y

# CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300
